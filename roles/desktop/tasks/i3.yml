---
- name: Get horizontal screen size
  become: true
  become_user: "{{ whoami }}"
  ansible.builtin.shell: set -o pipefail && xrandr | grep '*' | awk '{print $1}' | head -1 | cut -d'x' -f1
  environment:
    DISPLAY: ":0"
  check_mode: false
  register: desktop_horizontal_resolution
  changed_when: false
  failed_when: false

- name: Get vertical screen size
  become: true
  become_user: "{{ whoami }}"
  ansible.builtin.shell: set -o pipefail && xrandr | grep '*' | awk '{print $1}' | head -1 | cut -d'x' -f2
  environment:
    DISPLAY: ":0"
  check_mode: false
  register: desktop_vertical_resolution
  changed_when: false
  failed_when: false

- name: Fall back to default resolution when xrandr is unavailable
  ansible.builtin.set_fact:
    desktop_horizontal_resolution:
      stdout: "{{ (desktop_horizontal_resolution.stdout | default('') | trim) or '1920' }}"
    desktop_vertical_resolution:
      stdout: "{{ (desktop_vertical_resolution.stdout | default('') | trim) or '1080' }}"

- name: Set display scale
  ansible.builtin.set_fact:
    # Multiplier for the size of UI elements, equivalent to a display scale of
    # 200% elsewhere. i3 has no scaling setting, and neither does X11, so this
    # becomes an Xft.dpi of 96 * desktop_scale plus the toolkit-specific
    # environment variables in ~/.xprofile.
    desktop_scale: 2

- name: Set system font size
  ansible.builtin.set_fact:
    # Pango measures fonts in points rather than pixels, so these grow with
    # Xft.dpi on their own and are not multiplied by desktop_scale.
    desktop_font_size: 12

- name: Report detected resolution
  ansible.builtin.debug:
    msg: "resolution={{ desktop_horizontal_resolution.stdout }}x{{ desktop_vertical_resolution.stdout }} scale={{ desktop_scale }} font_size={{ desktop_font_size }}"
  changed_when: true

- name: Install i3 and friends
  ansible.builtin.dnf:
    name:
      - alacritty
      - bluez
      - brightnessctl
      - dunst
      - i3
      - lxappearance
      - maim
      - pamixer
      - numix-gtk-theme
      - rofi
      - unclutter-xfixes
      - xclip
      - xdotool
      - xrdb
      - xset
      - xsetroot
      - xss-lock

- name: Install i3-instant-layout from pypi # noqa: package-latest
  become: true
  become_user: "{{ whoami }}"
  ansible.builtin.pip:
    executable: /usr/bin/pip
    name: i3-instant-layout
    extra_args: --user
    state: latest

- name: Install screensaver required by IBM
  ansible.builtin.dnf:
    name: xscreensaver
  when: desktop_ibm_managed

- name: Check for Bluetooth device
  ansible.builtin.shell: set -o pipefail && timeout 5 bluetoothctl list | grep -oE '([[:xdigit:]]{2}:){5}[[:xdigit:]]{2}'
  register: desktop_bluetooth_devices
  failed_when: false
  changed_when: false

- name: Register bluetooth support
  ansible.builtin.set_fact:
    desktop_bluetooth_support: "{{ (desktop_bluetooth_devices.stdout != '') | bool }}"

- name: Create i3 config dirs
  ansible.builtin.file:
    dest: /home/{{ whoami }}/.config/{{ dir }}
    state: directory
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0700"
  loop:
    - dunst
    - i3
    - i3status
    - rofi
  loop_control:
    loop_var: dir

- name: Configure i3
  ansible.builtin.template:
    src: home/config/{{ dir }}/config
    dest: /home/{{ whoami }}/.config/{{ dir }}/config
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0600"
  loop:
    - i3
    - i3status
  loop_control:
    loop_var: dir
  notify: Restart i3

- name: Configure rofi/dmenu
  ansible.builtin.template:
    src: home/config/rofi/config.rasi
    dest: /home/{{ whoami }}/.config/rofi/config.rasi
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0600"
  notify: Restart i3

- name: Configure alacritty
  ansible.builtin.template:
    src: home/alacritty.toml
    dest: /home/{{ whoami }}/.alacritty.toml
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0600"

# https://cravencode.com/post/essentials/enable-tap-to-click-in-i3wm/
- name: Ensure xorg.conf.d directory exists
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d
    state: directory
    mode: "0755"

- name: Configure touchpad tap-to-click
  ansible.builtin.template:
    src: etc/X11/xorg.conf.d/90-touchpad.conf
    dest: /etc/X11/xorg.conf.d/90-touchpad.conf
    mode: "0644"

- name: Disable mouse acceleration
  ansible.builtin.template:
    src: etc/X11/xorg.conf.d/50-mouse-acceleration.conf
    dest: /etc/X11/xorg.conf.d/50-mouse-acceleration.conf
    mode: "0644"

- name: Configure display scaling
  ansible.builtin.template:
    src: home/Xresources
    dest: /home/{{ whoami }}/.Xresources
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0600"
  notify: Restart i3

- name: Configure X session environment
  ansible.builtin.template:
    src: home/xprofile
    dest: /home/{{ whoami }}/.xprofile
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0770"

- name: Configure X
  ansible.builtin.template:
    src: home/xinitrc
    dest: /home/{{ whoami }}/.xinitrc
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0770"

- name: Install xrandr & autorandr
  ansible.builtin.dnf:
    name:
      - autorandr
      - xrandr

- name: Enable autorandr
  ansible.builtin.systemd:
    name: autorandr
    enabled: true

- name: Configure greeter
  community.general.ini_file:
    path: /etc/lightdm/lightdm-gtk-greeter.conf
    section: greeter
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - option: background
      value: "#000000"
    # The greeter runs before ~/.Xresources is loaded, so it needs its own DPI.
    - option: xft-dpi
      value: "{{ (96 * desktop_scale) | int }}"

- name: Configure dunst
  ansible.builtin.template:
    src: home/config/dunst/dunstrc
    dest: /home/{{ whoami }}/.config/dunst/dunstrc
    owner: "{{ whoami }}"
    group: "{{ whoami }}"
    mode: "0660"
